<link rel="manifest" href="manifest.json">
<script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --bg: #1c1a17;
    --panel: #26221d;
    --panel-2: #302a23;
    --text: #f3ede2;
    --muted: #a89c8c;
    --gold: #d9a34d;
    --gold-dim: #8a6c39;
    --sage: #7a8f7f;
    --rust: #c1553f;
    --line: #3a332a;
  }

  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body{
    margin:0; padding:0; background: var(--bg); color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    min-height: 100vh;
  }

  .app{
    max-width: 480px;
    margin: 0 auto;
    padding: 28px 18px 40px;
    display:flex; flex-direction:column; gap:22px;
  }

  header{ text-align:center; padding: 6px 0 4px; }
  header h1{
    font-family:'Fraunces', serif;
    font-weight:600; font-optical-sizing:auto;
    font-size: 34px; letter-spacing: -0.02em; margin:0 0 6px;
    color: var(--text);
  }
  header p{
    margin:0; color: var(--muted); font-size: 13.5px; line-height:1.5;
    font-style: italic; font-family:'Fraunces', serif; font-weight:400;
  }

  .panel{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 20px;
  }

  .eyebrow{
    font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--gold); font-weight:600; margin: 0 0 12px;
  }

  /* --- Step 1 : choisir une photo --- */
  #step-photo .dropzone{
    border: 1.5px dashed var(--line);
    border-radius: 14px;
    padding: 34px 18px;
    text-align:center;
    cursor:pointer;
    transition: border-color .15s ease, background .15s ease;
  }
  #step-photo .dropzone:active{ background: var(--panel-2); border-color: var(--gold-dim); }
  #step-photo .dropzone svg{ margin-bottom:10px; opacity:.75; }
  #step-photo .dropzone .label{ font-size:14.5px; color: var(--text); font-weight:500; }
  #step-photo .dropzone .sub{ font-size:12.5px; color: var(--muted); margin-top:4px; }
  input[type=file]{ display:none; }

  /* --- Stage (canvas) --- */
  .stage{
    position: relative;
    border-radius: 14px;
    overflow:hidden;
    background:#000;
    line-height:0;
    touch-action: none;
  }
  .stage canvas{ width:100%; display:block; }

  .badge{
    position:absolute; top:10px; left:10px;
    display:flex; align-items:center; gap:6px;
    background: rgba(20,18,15,0.72);
    backdrop-filter: blur(4px);
    padding: 6px 10px 6px 8px;
    border-radius: 999px;
    font-size: 11.5px; font-weight:500;
    border: 1px solid rgba(255,255,255,0.08);
  }
  .badge .dot{ width:7px; height:7px; border-radius:50%; background: var(--muted); }
  .badge.ok .dot{ background: var(--sage); }
  .badge.off .dot{ background: var(--rust); }
  .badge .bars{ display:flex; align-items:flex-end; gap:2px; height:10px; margin-left:2px; }
  .badge .bars span{ width:2.5px; background: var(--sage); border-radius:1px; height:2px; transition: height .08s linear; }

  .timer{
    position:absolute; top:10px; right:10px;
    background: rgba(20,18,15,0.72);
    backdrop-filter: blur(4px);
    padding: 6px 12px;
    border-radius: 999px;
    font-variant-numeric: tabular-nums;
    font-size: 12.5px; font-weight:600;
    border: 1px solid rgba(255,255,255,0.08);
    display:flex; align-items:center; gap:6px;
  }
  .timer .rec{ width:8px; height:8px; border-radius:50%; background: var(--rust); }
  .timer.live .rec{ animation: blink 1s infinite; }
  @keyframes blink{ 50%{ opacity:.25; } }

  .hint{
    position:absolute; bottom:10px; left:50%; transform:translateX(-50%);
    background: rgba(20,18,15,0.72);
    backdrop-filter: blur(4px);
    padding: 5px 12px;
    border-radius: 999px;
    font-size: 11.5px; color: var(--text);
    border: 1px solid rgba(255,255,255,0.08);
    white-space:nowrap;
  }

  /* --- Controls --- */
  .controls{ display:flex; justify-content:center; margin-top:18px; }
  .play-btn{
    width:74px; height:74px; border-radius:50%;
    border: none; cursor:pointer;
    background: var(--gold); color: #1c1a17;
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 6px 20px rgba(217,163,77,0.28);
    transition: transform .12s ease, background .15s ease;
  }
  .play-btn:active{ transform: scale(0.94); }
  .play-btn.recording{ background: var(--rust); box-shadow: 0 6px 20px rgba(193,85,63,0.32); }
  .play-btn svg{ width:26px; height:26px; }

  .row-actions{ display:flex; gap:10px; justify-content:center; margin-top:14px; flex-wrap:wrap; }
  .btn{
    border:1px solid var(--line); background: var(--panel-2); color: var(--text);
    padding: 10px 16px; border-radius: 999px; font-size: 13.5px; font-weight:500;
    cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; gap:6px;
  }
  .btn:active{ background: #201c17; }
  .btn.primary{ background: var(--gold); color:#1c1a17; border-color: var(--gold); font-weight:600; }
  .btn.ghost{ background: transparent; color: var(--muted); border-color: transparent; }

  video#resultVideo{ width:100%; border-radius:14px; display:block; background:#000; }

  .msg{
    font-size: 12.5px; color: var(--muted); text-align:center; margin-top:12px; line-height:1.5;
  }
  .msg.error{ color: var(--rust); }

  [hidden]{ display:none !important; }

  footer{ text-align:center; color: var(--line); font-size:11px; padding-top:8px; }
</style>
</head>
<body>
<div class="app">

  <header>
    <h1>PicView</h1>
    <p>Une photo qui garde ta voix.</p>
  </header>

  <!-- Étape 1 : choisir une photo -->
  <section id="step-photo" class="panel">
    <p class="eyebrow">01 — Choisir une photo</p>
    <label class="dropzone" id="dropzone">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#d9a34d" stroke-width="1.4"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10.5" r="1.7"/><path d="M21 16l-5.2-5.2a1.5 1.5 0 0 0-2.1 0L5 19"/></svg>
      <div class="label">Toucher pour choisir une photo</div>
      <div class="sub">Depuis ta pellicule ou ton appareil</div>
      <input type="file" id="photoInput" accept="image/*">
    </label>
    <p class="msg" id="photoMsg"></p>
  </section>

  <!-- Étape 2 : enregistrement -->
  <section id="step-record" class="panel" hidden>
    <p class="eyebrow">02 — Enregistrer</p>
    <div class="stage" id="stage">
      <canvas id="canvas"></canvas>
      <div class="badge" id="micBadge"><span class="dot"></span><span id="micLabel">Micro : à activer</span><span class="bars" id="micBars"><span></span><span></span><span></span><span></span></span></div>
      <div class="timer" id="timer"><span class="rec"></span><span id="timerLabel">00:00</span></div>
      <div class="hint" id="hint">Touche la photo en parlant pour pointer</div>
    </div>
    <div class="controls">
      <button class="play-btn" id="playBtn" aria-label="Enregistrer">
        <svg id="playIcon" viewBox="0 0 24 24" fill="#1c1a17"><path d="M8 5v14l11-7z"/></svg>
      </button>
    </div>
    <div class="row-actions">
      <button class="btn ghost" id="changePhotoBtn">Changer de photo</button>
    </div>
    <p class="msg" id="recordMsg"></p>
  </section>

  <!-- Étape 3 : résultat -->
  <section id="step-result" class="panel" hidden>
    <p class="eyebrow">03 — Ta vidéo</p>
    <p class="msg" id="compressStatus"></p>
    <video id="resultVideo" controls playsinline hidden></video>
    <div class="row-actions" id="resultActions" hidden>
      <button class="btn primary" id="shareBtn" hidden>Envoyer</button>
      <a class="btn" id="downloadLink" download>Télécharger</a>
      <button class="btn ghost" id="redoBtn">Refaire</button>
    </div>
    <p class="msg" id="resultMsg"></p>
  </section>

  <footer>Prototype PicView</footer>
</div>

<script>
(function(){
  const dropzone = document.getElementById('dropzone');
  const photoInput = document.getElementById('photoInput');
  const stepPhoto = document.getElementById('step-photo');
  const stepRecord = document.getElementById('step-record');
  const stepResult = document.getElementById('step-result');
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const stage = document.getElementById('stage');
  const micBadge = document.getElementById('micBadge');
  const micLabel = document.getElementById('micLabel');
  const micBars = document.getElementById('micBars').children;
  const timerEl = document.getElementById('timer');
  const timerLabel = document.getElementById('timerLabel');
  const hint = document.getElementById('hint');
  const playBtn = document.getElementById('playBtn');
  const playIcon = document.getElementById('playIcon');
  const changePhotoBtn = document.getElementById('changePhotoBtn');
  const recordMsg = document.getElementById('recordMsg');
  const resultVideo = document.getElementById('resultVideo');
  const compressStatus = document.getElementById('compressStatus');
  const resultActions = document.getElementById('resultActions');
  const shareBtn = document.getElementById('shareBtn');
  const downloadLink = document.getElementById('downloadLink');
  const redoBtn = document.getElementById('redoBtn');
  const resultMsg = document.getElementById('resultMsg');

  const ICON_PLAY = '<path d="M8 5v14l11-7z"/>';
  const ICON_STOP = '<rect x="6" y="6" width="12" height="12" rx="2"/>';

  let img = null;
  let arrows = []; // {x,y,t}
  let micStream = null;
  let recorder = null;
  let recordedChunks = [];
  let recording = false;
  let startTime = 0;
  let timerInterval = null;
  let rafId = null;
  let audioCtx = null, analyser = null, levelData = null, levelRafId = null;
  let delayedAudioStream = null;
  const AUDIO_SYNC_DELAY = 0.12; // secondes — compense le léger retard d'encodage vidéo
  let chosenMime = '';

  // ---------- Étape 1 : photo ----------
  const photoMsg = document.getElementById('photoMsg');

  function finalizePhoto(source){
    img = source;
    const maxW = 420;
    const scale = Math.min(1, maxW / img.width);
    canvas.width = Math.round(img.width * scale);
    canvas.height = Math.round(img.height * scale);
    drawStatic();
    stepPhoto.hidden = true;
    stepRecord.hidden = false;
    stepResult.hidden = true;
    resetRecordUI();
  }

  photoInput.addEventListener('change', async (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;

    photoMsg.textContent = 'Chargement de la photo…';
    photoMsg.classList.remove('error');

    const loadingTimeout = setTimeout(() => {
      photoMsg.textContent = "Ça prend plus de temps que prévu — la photo est peut-être trop volumineuse ou dans un format non pris en charge (essaie une capture d'écran de la photo si le problème persiste).";
      photoMsg.classList.add('error');
    }, 6000);

    // Tentative 1 : createImageBitmap — meilleure compatibilité formats (dont HEIC)
    if (window.createImageBitmap) {
      try {
        const bitmap = await createImageBitmap(file);
        clearTimeout(loadingTimeout);
        photoMsg.textContent = '';
        photoMsg.classList.remove('error');
        finalizePhoto(bitmap);
        return;
      } catch (err) {
        // on retente ci-dessous avec la méthode classique
      }
    }

    // Tentative 2 (repli) : Image() + URL objet
    const objectUrl = URL.createObjectURL(file);
    const fallbackImg = new Image();
    fallbackImg.onload = () => {
      clearTimeout(loadingTimeout);
      photoMsg.textContent = '';
      photoMsg.classList.remove('error');
      finalizePhoto(fallbackImg);
      URL.revokeObjectURL(objectUrl);
    };
    fallbackImg.onerror = () => {
      clearTimeout(loadingTimeout);
      URL.revokeObjectURL(objectUrl);
      photoMsg.textContent = "Cette photo n'a pas pu être ouverte. Essaie une autre photo (idéalement au format JPEG).";
      photoMsg.classList.add('error');
    };
    fallbackImg.src = objectUrl;
  });

  changePhotoBtn.addEventListener('click', () => {
    stopEverything();
    stepRecord.hidden = true;
    stepPhoto.hidden = false;
    photoInput.value = '';
  });

  redoBtn.addEventListener('click', () => {
    stepResult.hidden = true;
    stepRecord.hidden = false;
    resetRecordUI();
    drawStatic();
  });

  function resetRecordUI(){
    arrows = [];
    recording = false;
    playBtn.classList.remove('recording');
    playIcon.innerHTML = ICON_PLAY;
    timerEl.classList.remove('live');
    timerLabel.textContent = '00:00';
    hint.hidden = false;
    recordMsg.textContent = '';
    recordMsg.classList.remove('error');
  }

  function drawStatic(){
    if (!img) return;
    ctx.clearRect(0,0,canvas.width, canvas.height);
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
  }

  // ---------- Micro ----------
  async function ensureMic(){
    if (micStream) return micStream;
    try{
      micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      micBadge.classList.add('ok'); micBadge.classList.remove('off');
      micLabel.textContent = 'Micro activé';
      setupLevelMeter(micStream);
      return micStream;
    }catch(err){
      micBadge.classList.add('off'); micBadge.classList.remove('ok');
      micLabel.textContent = 'Micro refusé';
      throw err;
    }
  }

  function setupLevelMeter(stream){
    try{
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const source = audioCtx.createMediaStreamSource(stream);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 32;
      levelData = new Uint8Array(analyser.frequencyBinCount);
      source.connect(analyser);

      // Chaîne séparée : retarde légèrement l'audio pour compenser le délai d'encodage vidéo
      const delay = audioCtx.createDelay(1.0);
      delay.delayTime.value = AUDIO_SYNC_DELAY;
      const dest = audioCtx.createMediaStreamDestination();
      source.connect(delay);
      delay.connect(dest);
      delayedAudioStream = dest.stream;
    }catch(e){ analyser = null; delayedAudioStream = null; }
  }

  function updateLevelMeter(){
    if (analyser){
      analyser.getByteFrequencyData(levelData);
      const avg = levelData.reduce((a,b)=>a+b,0) / levelData.length;
      for (let i=0;i<micBars.length;i++){
        const jitter = 0.6 + Math.random()*0.8;
        const h = Math.max(2, Math.min(10, (avg/255)*10*jitter*((i+1)/2)));
        micBars[i].style.height = h + 'px';
      }
    }
    if (recording) levelRafId = requestAnimationFrame(updateLevelMeter);
  }

  // ---------- Pointer / flèches ----------
  function canvasPointFromEvent(e){
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    return {
      x: (e.clientX - rect.left) * scaleX,
      y: (e.clientY - rect.top) * scaleY
    };
  }

  stage.addEventListener('pointerdown', (e) => {
    if (!recording) return;
    const p = canvasPointFromEvent(e);
    arrows.push({ x: p.x, y: p.y, t: performance.now() });
  });

  function drawArrow(x, y, alpha){
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(x, y);
    const s = canvas.width * 0.055;
    ctx.fillStyle = '#d9a34d';
    ctx.strokeStyle = 'rgba(28,26,23,0.85)';
    ctx.lineWidth = s * 0.12;
    ctx.beginPath();
    ctx.moveTo(0, -s*1.9);
    ctx.lineTo(s*0.85, -s*0.55);
    ctx.lineTo(s*0.3, -s*0.55);
    ctx.lineTo(s*0.3, s*0.15);
    ctx.lineTo(-s*0.3, s*0.15);
    ctx.lineTo(-s*0.3, -s*0.55);
    ctx.lineTo(-s*0.85, -s*0.55);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(0, s*0.55, s*0.16, 0, Math.PI*2);
    ctx.fillStyle = '#d9a34d';
    ctx.fill();
    ctx.restore();
  }

  const ARROW_LIFETIME = 500; // ms

  function renderFrame(){
    ctx.clearRect(0,0,canvas.width, canvas.height);
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    const now = performance.now();
    arrows = arrows.filter(a => now - a.t < ARROW_LIFETIME);
    for (const a of arrows){
      const age = now - a.t;
      const alpha = 1 - (age / ARROW_LIFETIME);
      drawArrow(a.x, a.y, Math.max(0, alpha));
    }
    if (recording) rafId = requestAnimationFrame(renderFrame);
  }

  // ---------- Enregistrement ----------
  function pickMimeType(){
    const candidates = [
      'video/mp4;codecs=avc1,mp4a.40.2',
      'video/mp4',
      'video/webm;codecs=vp9,opus',
      'video/webm;codecs=vp8,opus',
      'video/webm'
    ];
    for (const c of candidates){
      if (window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(c)) return c;
    }
    return '';
  }

  playBtn.addEventListener('click', async () => {
    if (!recording) startRecording(); else stopRecording();
  });

  async function startRecording(){
    recordMsg.textContent = '';
    recordMsg.classList.remove('error');

    if (!window.MediaRecorder || !canvas.captureStream){
      recordMsg.textContent = "Cet appareil ne permet pas l'enregistrement vidéo dans ce navigateur.";
      recordMsg.classList.add('error');
      return;
    }

    try{
      await ensureMic();
    }catch(err){
      recordMsg.textContent = "Le micro a été refusé — autorise-le dans les réglages du navigateur pour continuer.";
      recordMsg.classList.add('error');
      return;
    }

    try{
      const canvasStream = canvas.captureStream(15);
      const audioTracks = (delayedAudioStream && delayedAudioStream.getAudioTracks().length)
        ? delayedAudioStream.getAudioTracks()
        : micStream.getAudioTracks();
      const combined = new MediaStream([
        ...canvasStream.getVideoTracks(),
        ...audioTracks
      ]);
      chosenMime = pickMimeType();
      const recorderOptions = {
        videoBitsPerSecond: 200000, // ~200 kbps — iOS ne respecte pas toujours cette valeur à la lettre
        audioBitsPerSecond: 48000   // ~48 kbps — voix correcte, très léger
      };
      if (chosenMime) recorderOptions.mimeType = chosenMime;
      recorder = new MediaRecorder(combined, recorderOptions);
      recordedChunks = [];
      recorder.ondataavailable = (e) => { if (e.data && e.data.size > 0) recordedChunks.push(e.data); };
      recorder.onstop = handleRecordingStop;
      recorder.start();

      recording = true;
      arrows = [];
      startTime = Date.now();
      timerEl.classList.add('live');
      hint.hidden = true;
      timerInterval = setInterval(updateTimer, 200);
      rafId = requestAnimationFrame(renderFrame);
      levelRafId = requestAnimationFrame(updateLevelMeter);

      playBtn.classList.add('recording');
      playIcon.innerHTML = ICON_STOP;
    }catch(err){
      recordMsg.textContent = "Impossible de démarrer l'enregistrement sur cet appareil.";
      recordMsg.classList.add('error');
    }
  }

  function stopRecording(){
    if (recorder && recorder.state !== 'inactive') recorder.stop();
    recording = false;
    clearInterval(timerInterval);
    cancelAnimationFrame(rafId);
    cancelAnimationFrame(levelRafId);
    timerEl.classList.remove('live');
    playBtn.classList.remove('recording');
    playIcon.innerHTML = ICON_PLAY;
    if (micStream){
      micStream.getTracks().forEach(t => t.stop());
      micStream = null;
    }
    if (audioCtx){ audioCtx.close(); audioCtx = null; analyser = null; }
    delayedAudioStream = null;
    micBadge.classList.remove('ok'); micBadge.classList.remove('off');
    micLabel.textContent = 'Micro : à activer';
  }

  function stopEverything(){
    if (recording) stopRecording();
  }

  function updateTimer(){
    const elapsed = Date.now() - startTime;
    const mm = String(Math.floor(elapsed / 60000)).padStart(2,'0');
    const ss = String(Math.floor((elapsed % 60000)/1000)).padStart(2,'0');
    timerLabel.textContent = mm + ':' + ss;
  }

  // ---------- Compression ----------
  let ffmpegInstance = null;

  async function compressVideo(blob, mimeForBlob){
    const { createFFmpeg, fetchFile } = FFmpeg;
    if (!ffmpegInstance){
      ffmpegInstance = createFFmpeg({
        log: false,
        corePath: 'https://unpkg.com/@ffmpeg/core@0.11.0/dist/ffmpeg-core.js'
      });
    }
    if (!ffmpegInstance.isLoaded()){
      await ffmpegInstance.load();
    }
    const inputExt = mimeForBlob.includes('mp4') ? 'mp4' : 'webm';
    const inputName = 'in.' + inputExt;
    ffmpegInstance.FS('writeFile', inputName, await fetchFile(blob));
    await ffmpegInstance.run(
      '-i', inputName,
      '-vf', 'scale=360:-2',
      '-r', '12',
      '-c:v', 'libx264',
      '-preset', 'veryfast',
      '-b:v', '120k',
      '-c:a', 'aac',
      '-b:a', '32k',
      '-movflags', '+faststart',
      'out.mp4'
    );
    const data = ffmpegInstance.FS('readFile', 'out.mp4');
    try{ ffmpegInstance.FS('unlink', inputName); }catch(e){}
    try{ ffmpegInstance.FS('unlink', 'out.mp4'); }catch(e){}
    return new Blob([data.buffer], { type: 'video/mp4' });
  }

  async function handleRecordingStop(){
    const mimeForBlob = chosenMime ? chosenMime.split(';')[0] : 'video/webm';
    const rawBlob = new Blob(recordedChunks, { type: mimeForBlob });

    stepRecord.hidden = true;
    stepResult.hidden = false;
    resultVideo.hidden = true;
    resultActions.hidden = true;
    resultMsg.textContent = '';
    resultMsg.classList.remove('error');
    compressStatus.textContent = 'Compression de la vidéo… (quelques secondes)';
    compressStatus.classList.remove('error');

    let finalBlob = rawBlob;
    let finalMime = mimeForBlob;
    let compressed = false;

    try{
      if (window.FFmpeg){
        finalBlob = await compressVideo(rawBlob, mimeForBlob);
        finalMime = 'video/mp4';
        compressed = true;
      }
    }catch(err){
      finalBlob = rawBlob;
      finalMime = mimeForBlob;
      compressed = false;
    }

    compressStatus.textContent = '';
    finalizeResult(finalBlob, finalMime, compressed);
  }

  function finalizeResult(blob, mimeForBlob, compressed){
    const url = URL.createObjectURL(blob);
    const ext = mimeForBlob.includes('mp4') ? 'mp4' : 'webm';
    const filename = 'picview-' + new Date().toISOString().slice(0,16).replace(/[-:T]/g,'') + '.' + ext;

    resultVideo.src = url;
    resultVideo.hidden = false;
    downloadLink.href = url;
    downloadLink.download = filename;
    resultActions.hidden = false;

    const sizeKo = Math.round(blob.size / 1024);
    if (compressed){
      resultMsg.textContent = 'Vidéo compressée — ' + sizeKo + ' Ko.';
      resultMsg.classList.remove('error');
    } else if (mimeForBlob.includes('mp4')){
      resultMsg.textContent = sizeKo + ' Ko.';
      resultMsg.classList.remove('error');
    } else {
      resultMsg.textContent = "Format .webm — lisible sur la plupart des appareils et messageries (" + sizeKo + " Ko).";
      resultMsg.classList.remove('error');
    }

    const file = new File([blob], filename, { type: mimeForBlob });
    if (navigator.canShare && navigator.canShare({ files: [file] })){
      shareBtn.hidden = false;
      shareBtn.onclick = async () => {
        try{ await navigator.share({ files: [file], title: 'PicView' }); }
        catch(e){ /* annulé par l'utilisateur */ }
      };
    } else {
      shareBtn.hidden = true;
    }
  }

})();
</script>
</body>
</html>
