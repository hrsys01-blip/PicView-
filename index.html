<link rel="manifest" href="manifest.json">
<script src="https://unpkg.com/@ffmpeg/ffmpeg@0.11.6/dist/ffmpeg.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --bg: #ffffff;
    --ink: #16140f;
    --muted: #6b6b6e;
    --line: #e1ddd0;
    --green: #34c759;
    --green-ink: #ffffff;
    --rust: #dc3c32;
  }

  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body{
    margin:0; padding:0; background: var(--bg); color: var(--ink);
    font-family: 'Inter', system-ui, sans-serif;
    min-height: 100vh;
  }

  .app{
    max-width: 480px;
    margin: 0 auto;
    padding: 0 0 32px;
    display:flex; flex-direction:column;
  }

  /* ---------- Top nav: back / language / menu ---------- */
  .topnav{
    display:flex; align-items:center; justify-content:space-between;
    padding: 14px 18px;
    padding-top: max(14px, env(safe-area-inset-top));
    min-height: 54px;
  }
  .topnav .side{ display:flex; align-items:center; gap:14px; min-width:36px; }
  .navBtn{
    background:none; border:none; padding:4px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    color: var(--ink);
  }
  .navBtn svg{ width:20px; height:20px; }
  .navBtn[hidden]{ visibility:hidden; }

  .langWrap{ position:relative; }
  .langBtn{
    display:flex; align-items:center; gap:5px;
    background:none; border:none; cursor:pointer;
    font-size:13px; font-weight:500; color: var(--ink);
    padding:4px 2px;
  }
  .langBtn svg{ width:17px; height:17px; }
  .langBtn .car{ width:20px; height:20px; opacity:.75; }

  .langMenu{
    position:absolute; top:32px; left:50%; transform:translateX(-50%);
    background:#fff; border:1px solid var(--line); border-radius:10px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.12);
    min-width:140px; padding:6px 0; z-index:20;
  }
  .langOption{
    display:flex; align-items:center; justify-content:space-between;
    padding:9px 14px; font-size:14px; cursor:pointer; white-space:nowrap;
  }
  .langOption:active{ background:#f4f3ef; }
  .langOption .check{ color: var(--green); font-weight:700; margin-left:10px; }
  .langDivider{ height:1px; background: var(--line); margin:4px 10px; }



  /* ---------- Photo / stage card ---------- */
  .card{
    position:relative;
    margin: 0 0 0;
    height: 460px;
    border-radius: 26px;
    overflow:hidden;
    background:#e9e4d6;
  }
  .card canvas{ width:100%; height:100%; object-fit:cover; display:block; }
  .card video{ width:100%; height:100%; object-fit:cover; display:block; background:#000; }

  #step-photo .card{
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    border: 1.5px dashed var(--line);
    background: #faf9f6;
  }
  #step-photo .card:active{ background:#f2f0ea; }
  .dropInner{ text-align:center; padding: 30px 24px; }
  .dropInner svg{ margin-bottom:20px; }
  .dropInner .label{ font-size:17px; font-weight:700; color: var(--ink); }
  .dropInner .sub{ font-size:15px; color: var(--muted); margin-top:6px; }
  input[type=file]{ display:none; }

  /* ---------- Press / Then / Talk & Point overlay (idle, before recording) ---------- */
  .pressOverlay{
    position:absolute; top:0; left:0; right:0; bottom:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    pointer-events:none;
  }
  .pressOverlay > *{ pointer-events:none; }
  .pressLabel, .thenLabel{
    color:#fff; font-weight:700; font-size:15px;
    text-shadow: 0 1px 6px rgba(0,0,0,0.45);
    -webkit-text-stroke: 0.1px rgba(0,0,0,0.85);
  }
  .thenLabel{ margin-top:14px; }
  .talkPoint{
    color:#fff; font-weight:700; font-size:30px; margin-top:6px;
    text-shadow: 0 1px 8px rgba(0,0,0,0.5);
    -webkit-text-stroke: 0.1px rgba(0,0,0,0.85);
    text-align:center;
  }
  .recordCircle{
    pointer-events:auto;
    width:68px; height:68px; border-radius:50%;
    background:#fff; border:2px solid #d2d2d2;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; margin:10px 0;
  }
  .recordCircle .dot{
    width:44px; height:44px; border-radius:50%; background: var(--rust);
  }

  /* ---------- Below-stage controls (recording in progress) ---------- */
  .belowStage{ display:flex; flex-direction:column; align-items:center; margin-top:22px; }
  .cancelLink{
    background:#f4f3ef; border:none; border-radius:20px; cursor:pointer;
    margin-top:20px; padding:9px 18px;
    display:flex; align-items:center; gap:6px;
    font-size:15px; font-weight:600; color: var(--muted);
  }
  .cancelLink svg{ width:14px; height:14px; }
  .timerRow{
    display:flex; align-items:center; gap:8px;
    font-size:19px; font-weight:700; color:#2a2a2a;
    margin-bottom:26px;
  }
  .blinkDot{
    width:12px; height:12px; border-radius:50%; background: var(--rust);
    box-shadow: 0 0 0 5px rgba(220,60,50,0.18);
    animation: blinkdot 1s infinite;
  }
  @keyframes blinkdot{ 50%{ opacity:.3; } }
  .stopBtn{
    width:88px; height:88px; border-radius:50%;
    background:#fff; border:2px solid #d2d2d2;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .stopBtn .core{
    width:62px; height:62px; border-radius:50%; background: var(--rust);
    display:flex; align-items:center; justify-content:center;
    animation: blinkdot 1s infinite;
  }
  .stopBtn .sq{ width:30px; height:30px; border-radius:6px; background:#fff; }

  /* ---------- Result actions ---------- */
  .actionsPanel{ margin-top:24px; }
  .btnPrimary{
    display:block; width:100%; text-align:center;
    background: var(--green); color: var(--green-ink);
    border:none; border-radius:13px; padding:14px 0;
    font-size:16px; font-weight:700; cursor:pointer;
  }
  .btnPrimary:active{ opacity:.85; }
  .secondaryRow{ display:flex; justify-content:space-around; margin-top:22px; }
  .btnSecondary{
    background:none; border:none; cursor:pointer; text-decoration:none;
    display:flex; flex-direction:column; align-items:center; gap:7px;
    color: var(--ink); font-size:13px; padding:2px 6px;
  }
  .btnSecondary svg{ width:20px; height:20px; }
  .btnSecondary .badge{
    position:relative;
  }
  .btnSecondary .plusBadge{
    position:absolute; right:-6px; bottom:-6px;
    width:14px; height:14px; border-radius:50%;
    background:#fff; border:1.5px solid var(--ink);
    display:flex; align-items:center; justify-content:center;
  }
  .btnSecondary .plusBadge svg{ width:8px; height:8px; }

  /* ---------- Brand footer ---------- */
  .brand{
    position:fixed; left:50%; bottom: max(14px, env(safe-area-inset-bottom));
    transform: translateX(-50%);
    display:flex; align-items:center; justify-content:center; gap:11px;
    margin:0; z-index:15;
  }
  .brand img{ width:72px; height:72px; }
  .brand span{ font-family:'Inter',sans-serif; font-weight:700; font-size:40px; color:#3c3c3f; }

  /* ---------- Messages ---------- */
  .msg{ font-size:12.5px; color: var(--muted); text-align:center; margin-top:12px; line-height:1.5; padding:0 20px; }
  .msg.error{ color: var(--rust); }

  section.step{ padding: 0 18px calc(110px + env(safe-area-inset-bottom)); }

  #step-photo{
    display:flex; flex-direction:column;
    min-height: calc(100vh - 54px);
  }

  #step-record{
    display:flex; flex-direction:column;
    min-height: calc(100vh - 54px);
  }

  [hidden]{ display:none !important; }  /* ---------- Action sheet (4-choice menu) ---------- */
  .sheetOverlay{
    position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.4);
    z-index:9998; display:flex; flex-direction:column; justify-content:flex-end;
    padding: 0 10px max(10px, env(safe-area-inset-bottom));
  }
  .actionSheet{
    background:#fff; border-radius:14px; overflow:hidden; margin-bottom:8px;
  }
  .sheetBtn{
    display:block; width:100%; background:#fff; border:none; border-top:1px solid #e1ddd0;
    padding:16px 0; font-size:17px; font-weight:500; color: var(--ink); cursor:pointer;
  }
  .actionSheet .sheetBtn:first-child{ border-top:none; }
  .sheetDanger{ color: var(--rust); font-weight:600; }
  .sheetCancel{
    background:#fff; border-radius:14px; font-weight:700; border:none;
    padding:16px 0; font-size:17px; color: var(--ink); cursor:pointer;
  }

  /* ---------- Splash screen ---------- */
  .splashScreen{
    position:fixed; top:0; left:0; right:0; bottom:0; background:#fff; z-index:9999;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    transition: opacity 0.4s ease;
    padding: 0 30px;
  }
  .splashLogo{ width:220px; height:auto; display:block; }
  .splashTagline{
    font-family: Georgia, 'Times New Roman', serif; font-style:italic;
    font-size:20px; color:#6b6b6e; margin-top:20px; text-align:center;
  }
  .splashSub{
    font-family:'Inter',sans-serif; font-weight:700; font-size:15px;
    letter-spacing:5px; color:#34c759; margin-top:26px; text-align:center;
  }
</style>
</head>

  };

  let currentLang = localStorage.getItem('sonopic_lang') || 'en';

  function applyLanguage(){
    document.documentElement.lang = currentLang;
    document.getElementById('langCode').textContent = currentLang.toUpperCase();
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n');
      if (STRINGS[currentLang][key] !== undefined) el.textContent = STRINGS[currentLang][key];
    });
    document.querySelectorAll('[data-check]').forEach(el => {
      el.hidden = el.getAttribute('data-check') !== currentLang;
    });
  }

  const langBtn = document.getElementById('langBtn');
  const langMenu = document.getElementById('langMenu');
  langBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    langMenu.hidden = !langMenu.hidden;
  });
  document.addEventListener('click', () => { langMenu.hidden = true; });
  langMenu.querySelectorAll('.langOption').forEach(opt => {
    opt.addEventListener('click', () => {
      currentLang = opt.getAttribute('data-lang');
      localStorage.setItem('sonopic_lang', currentLang);
      applyLanguage();
      langMenu.hidden = true;
    });
  });

  applyLanguage();

  // ============ Splash screen ============
  setTimeout(() => {
    const splash = document.getElementById('splashScreen');
    if (splash){
      splash.style.opacity = '0';
      setTimeout(() => { splash.style.display = 'none'; }, 400);
    }
  }, 3100);

  // ============ Elements ============
  const dropzone = document.getElementById('dropzone');
  const photoInput = document.getElementById('photoInput');
  const stepPhoto = document.getElementById('step-photo');
  const stepRecord = document.getElementById('step-record');
  const stepResult = document.getElementById('step-result');
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const stage = document.getElementById('stage');
  const pressOverlay = document.getElementById('pressOverlay');
  const recordCircle = document.getElementById('recordCircle');
  const belowStage = document.getElementById('belowStage');
  const timerLabel = document.getElementById('timerLabel');
  const stopBtn = document.getElementById('stopBtn');
  const recordMsg = document.getElementById('recordMsg');
  const resultVideo = document.getElementById('resultVideo');
  const compressStatus = document.getElementById('compressStatus');
  const resultActions = document.getElementById('resultActions');
  const shareBtn = document.getElementById('shareBtn');
  const downloadLink = document.getElementById('downloadLink');
  const redoBtn = document.getElementById('redoBtn');
  const newPhotoBtn = document.getElementById('newPhotoBtn');
  const resultMsg = document.getElementById('resultMsg');
  const backBtn = document.getElementById('backBtn');
  const photoMsg = document.getElementById('photoMsg');

  let img = null;
  let arrows = [];
  let micStream = null;
  let recorder = null;
  let recordedChunks = [];
  let recording = false;
  let startTime = 0;
  let timerInterval = null;
  let rafId = null;

  let delayedAudioStream = null;
  const AUDIO_SYNC_DELAY = 0.12;
  let chosenMime = '';

  // ============ Navigation (back button) ============
  function showStep(step){
    stepPhoto.hidden = step !== 'photo';
    stepRecord.hidden = step !== 'record';
    stepResult.hidden = step !== 'result';
    backBtn.hidden = step === 'photo';
  }

  backBtn.addEventListener('click', () => {
    if (!stepRecord.hidden){ stopEverything(); showStep('photo'); photoInput.value = ''; }
    else if (!stepResult.hidden){ showStep('record'); resetRecordUI(); drawStatic(); }
  });

  const cancelRecordBtn = document.getElementById('cancelRecordBtn');
  cancelRecordBtn.addEventListener('click', () => {
    stopEverything();
    showStep('photo');
    photoInput.value = '';
  });

  // ============ Étape 1 : photo ============
  function finalizePhoto(source){
    img = source;
    const maxW = 420;
    const scale = Math.min(1, maxW / img.width);
    canvas.width = Math.round(img.width * scale);
    canvas.height = Math.round(img.height * scale);
    drawStatic();
    showStep('record');
    resetRecordUI();
  }

  photoInput.addEventListener('change', async (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;

    photoMsg.textContent = STRINGS[currentLang].photoLoading;
    photoMsg.classList.remove('error');

    const loadingTimeout = setTimeout(() => {
      photoMsg.textContent = STRINGS[currentLang].photoTooSlow;
      photoMsg.classList.add('error');
    }, 6000);

    if (window.createImageBitmap) {
      try {
        const bitmap = await createImageBitmap(file);
        clearTimeout(loadingTimeout);
        photoMsg.textContent = '';
        photoMsg.classList.remove('error');
        finalizePhoto(bitmap);
        return;
      } catch (err) { /* repli ci-dessous */ }
    }

    const objectUrl = URL.createObjectURL(file);
    const fallbackImg = new Image();
    fallbackImg.onload = () => {
      clearTimeout(loadingTimeout);
      photoMsg.textContent = '';
      photoMsg.classList.remove('error');
      finalizePhoto(fallbackImg);
      URL.revokeObjectURL(objectUrl);
    };
    fallbackImg.onerror = () => {
      clearTimeout(loadingTimeout);
      URL.revokeObjectURL(objectUrl);
      photoMsg.textContent = STRINGS[currentLang].photoFailed;
      photoMsg.classList.add('error');
    };
    fallbackImg.src = objectUrl;
  });

  redoBtn.addEventListener('click', () => {
    showStep('record');
    resetRecordUI();
    drawStatic();
  });

  const sheetOverlay = document.getElementById('sheetOverlay');
  const sheetSave = document.getElementById('sheetSave');
  const sheetSend = document.getElementById('sheetSend');
  const sheetDiscard = document.getElementById('sheetDiscard');
  const sheetCancel = document.getElementById('sheetCancel');

  function backToPhotoScreen(){
    stopEverything();
    showStep('photo');
    photoInput.value = '';
  }

  newPhotoBtn.addEventListener('click', () => {
    sheetOverlay.hidden = false;
  });

  sheetCancel.addEventListener('click', () => {
    sheetOverlay.hidden = true;
  });

  sheetSave.addEventListener('click', () => {
    sheetOverlay.hidden = true;
    downloadLink.click();
    backToPhotoScreen();
  });

  sheetSend.addEventListener('click', async () => {
    sheetOverlay.hidden = true;
    if (shareBtn.onclick){
      try{ await shareBtn.onclick(); }catch(e){}
    }
  });

  sheetDiscard.addEventListener('click', () => {
    sheetOverlay.hidden = true;
    backToPhotoScreen();
  });

  function resetRecordUI(){
    arrows = [];
    recording = false;
    pressOverlay.hidden = false;
    belowStage.hidden = true;
    timerLabel.textContent = '00:00';
    recordMsg.textContent = '';
    recordMsg.classList.remove('error');
  }

  function drawStatic(){
    if (!img) return;
    ctx.clearRect(0,0,canvas.width, canvas.height);
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
  }

  // ============ Micro ============
  async function ensureMic(){
    if (micStream) return micStream;
    try{
      micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
      setupLevelMeter(micStream);
      return micStream;
    }catch(err){
      throw err;
    }
  }

  function setupLevelMeter(stream){
    try{
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const source = audioCtx.createMediaStreamSource(stream);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 32;
      levelData = new Uint8Array(analyser.frequencyBinCount);
      source.connect(analyser);

      const delay = audioCtx.createDelay(1.0);
      delay.delayTime.value = AUDIO_SYNC_DELAY;
      const dest = audioCtx.createMediaStreamDestination();
      source.connect(delay);
      delay.connect(dest);
      delayedAudioStream = dest.stream;
    }catch(e){ analyser = null; delayedAudioStream = null; }
  }

  // ============ Pointer / flèches ============
  function canvasPointFromEvent(e){
    const rect = canvas.getBoundingClientRect();
    const scale = Math.max(rect.width / canvas.width, rect.height / canvas.height);
    const dispW = canvas.width * scale;
    const dispH = canvas.height * scale;
    const offsetX = (dispW - rect.width) / 2;
    const offsetY = (dispH - rect.height) / 2;
    return {
      x: ((e.clientX - rect.left) + offsetX) / scale,
      y: ((e.clientY - rect.top) + offsetY) / scale
    };
  }

  stage.addEventListener('pointerdown', (e) => {
    if (!recording) return;
    const p = canvasPointFromEvent(e);
    arrows.push({ x: p.x, y: p.y, t: performance.now() });
  });

  function drawArrow(x, y, alpha){
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(x, y);
    const s = canvas.width * 0.044;
    const L = s * 1.4;
    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = 'rgba(0,0,0,0.9)';
    ctx.lineWidth = s * 0.10;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(0, 1.0*L);
    ctx.lineTo(-0.231*L, 0.806*L);
    ctx.lineTo(-0.372*L, 1.183*L);
    ctx.lineTo(-0.520*L, 1.126*L);
    ctx.lineTo(-0.383*L, 0.750*L);
    ctx.lineTo(-0.716*L, 0.733*L);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }

  let watermarkLogoGray = null;
  function getGrayscaleLogo(){
    if (watermarkLogoGray) return watermarkLogoGray;
    if (!watermarkLogo.complete || watermarkLogo.naturalWidth === 0) return null;
    const off = document.createElement('canvas');
    off.width = watermarkLogo.naturalWidth;
    off.height = watermarkLogo.naturalHeight;
    const octx = off.getContext('2d');
    octx.drawImage(watermarkLogo, 0, 0);
    const imgData = octx.getImageData(0, 0, off.width, off.height);
    const d = imgData.data;
    for (let i = 0; i < d.length; i += 4){
      const gray = d[i]*0.3 + d[i+1]*0.59 + d[i+2]*0.11;
      d[i] = d[i+1] = d[i+2] = gray;
    }
    octx.putImageData(imgData, 0, 0);
    watermarkLogoGray = off;
    return watermarkLogoGray;
  }

  function drawWatermark(){
    const grayLogo = getGrayscaleLogo();
    if (!grayLogo) return;
    const elapsed = Date.now() - startTime;
    if (elapsed > 150) return; // logo visible seulement ~150ms au tout début (pour la vignette)

    const size = canvas.width * 0.5;
    const x = (canvas.width - size) / 2;
    const y = (canvas.height - size) / 2;
    ctx.save();
    ctx.globalAlpha = 0.35;
    ctx.drawImage(grayLogo, x, y, size, size);
    ctx.restore();
  }

  function renderFrame(){
    ctx.clearRect(0,0,canvas.width, canvas.height);
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    const now = performance.now();
    arrows = arrows.filter(a => now - a.t < ARROW_LIFETIME);
    for (const a of arrows){
      const age = now - a.t;
      const alpha = 1 - (age / ARROW_LIFETIME);
      drawArrow(a.x, a.y, Math.max(0, alpha));
    }
    drawWatermark();
    if (recording) rafId = requestAnimationFrame(renderFrame);
  }

  // ============ Enregistrement ============
  function pickMimeType(){
    const candidates = [
      'video/mp4;codecs=avc1,mp4a.40.2',
      'video/mp4',
      'video/webm;codecs=vp9,opus',
      'video/webm;codecs=vp8,opus',
      'video/webm'
    ];
    for (const c of candidates){
      if (window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(c)) return c;
    }
    return '';
  }

  recordCircle.addEventListener('click', startRecording);
  stopBtn.addEventListener('click', stopRecording);

  async function startRecording(){
    recordMsg.textContent = '';
    recordMsg.classList.remove('error');

    if (!window.MediaRecorder || !canvas.captureStream){
      recordMsg.textContent = STRINGS[currentLang].recordUnsupported;
      recordMsg.classList.add('error');
      return;
    }

    try{
      await ensureMic();
    }catch(err){
      recordMsg.textContent = STRINGS[currentLang].micRefused;
      recordMsg.classList.add('error');
      return;
    }

    try{
      const canvasStream = canvas.captureStream(15);
      const audioTracks = (delayedAudioStream && delayedAudioStream.getAudioTracks().length)
        ? delayedAudioStream.getAudioTracks()
        : micStream.getAudioTracks();
      const combined = new MediaStream([
        ...canvasStream.getVideoTracks(),
        ...audioTracks
      ]);
      chosenMime = pickMimeType();
      const recorderOptions = {
        videoBitsPerSecond: 200000,
        audioBitsPerSecond: 48000
      };
      if (chosenMime) recorderOptions.mimeType = chosenMime;
      recorder = new MediaRecorder(combined, recorderOptions);
      recordedChunks = [];
      recorder.ondataavailable = (e) => { if (e.data && e.data.size > 0) recordedChunks.push(e.data); };
      recorder.onstop = handleRecordingStop;
      recorder.start();

      recording = true;
      arrows = [];
      startTime = Date.now();
      pressOverlay.hidden = true;
      belowStage.hidden = false;
      timerInterval = setInterval(updateTimer, 200);
      rafId = requestAnimationFrame(renderFrame);
      levelRafId = requestAnimationFrame(updateLevelMeter);
    }catch(err){
      recordMsg.textContent = STRINGS[currentLang].recordFailed;
      recordMsg.classList.add('error');
    }
  }

  function updateLevelMeter(){
    if (recording) levelRafId = requestAnimationFrame(updateLevelMeter);
  }

  function stopRecording(){
    if (recorder && recorder.state !== 'inactive') recorder.stop();
    recording = false;
    clearInterval(timerInterval);
    cancelAnimationFrame(rafId);
    cancelAnimationFrame(levelRafId);
    if (micStream){
      micStream.getTracks().forEach(t => t.stop());
      micStream = null;
    }
    if (audioCtx){ audioCtx.close(); audioCtx = null; analyser = null; }
    delayedAudioStream = null;
  }

  function stopEverything(){
    if (recording) stopRecording();
  }

  // ============ Reset to a clean state whenever the app is backgrounded ============
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden'){
      stopEverything();
      img = null;
      arrows = [];
      photoInput.value = '';
      showStep('photo');
    }
  });

  function updateTimer(){
    const elapsed = Date.now() - startTime;
    const mm = String(Math.floor(elapsed / 60000)).padStart(2,'0');
    const ss = String(Math.floor((elapsed % 60000)/1000)).padStart(2,'0');
    timerLabel.textContent = mm + ':' + ss;
  }

  // ============ Compression ============
  let ffmpegInstance = null;

  async function compressVideo(blob, mimeForBlob){
    const { createFFmpeg, fetchFile } = FFmpeg;
    if (!ffmpegInstance){
      ffmpegInstance = createFFmpeg({
        log: false,
        corePath: 'https://unpkg.com/@ffmpeg/core@0.11.0/dist/ffmpeg-core.js'
      });
    }
    if (!ffmpegInstance.isLoaded()){
      await ffmpegInstance.load();
    }
    const inputExt = mimeForBlob.includes('mp4') ? 'mp4' : 'webm';
    const inputName = 'in.' + inputExt;
    ffmpegInstance.FS('writeFile', inputName, await fetchFile(blob));
    await ffmpegInstance.run(
      '-i', inputName,
      '-vf', 'scale=360:-2',
      '-r', '12',
      '-c:v', 'libx264',
      '-preset', 'veryfast',
      '-b:v', '120k',
      '-c:a', 'aac',
      '-b:a', '32k',
      '-movflags', '+faststart',
      'out.mp4'
    );
    const data = ffmpegInstance.FS('readFile', 'out.mp4');
    try{ ffmpegInstance.FS('unlink', inputName); }catch(e){}
    try{ ffmpegInstance.FS('unlink', 'out.mp4'); }catch(e){}
    return new Blob([data.buffer], { type: 'video/mp4' });
  }

  async function handleRecordingStop(){
    const mimeForBlob = chosenMime ? chosenMime.split(';')[0] : 'video/webm';
    const rawBlob = new Blob(recordedChunks, { type: mimeForBlob });

    showStep('result');
    resultVideo.hidden = true;
    resultActions.hidden = true;
    resultMsg.textContent = '';
    resultMsg.classList.remove('error');
    compressStatus.textContent = STRINGS[currentLang].compressing;
    compressStatus.classList.remove('error');

    let finalBlob = rawBlob;
    let finalMime = mimeForBlob;
    let compressed = false;

    try{
      if (window.FFmpeg){
        finalBlob = await compressVideo(rawBlob, mimeForBlob);
        finalMime = 'video/mp4';
        compressed = true;
      }
    }catch(err){
      finalBlob = rawBlob;
      finalMime = mimeForBlob;
      compressed = false;
    }

    compressStatus.textContent = '';
    finalizeResult(finalBlob, finalMime, compressed);
  }

  function finalizeResult(blob, mimeForBlob, compressed){
    const url = URL.createObjectURL(blob);
    const ext = mimeForBlob.includes('mp4') ? 'mp4' : 'webm';
    const filename = 'sonopic-' + new Date().toISOString().slice(0,16).replace(/[-:T]/g,'') + '.' + ext;

    resultVideo.src = url;
    resultVideo.hidden = false;
    downloadLink.href = url;
    downloadLink.download = filename;
    resultActions.hidden = false;

    const sizeKo = Math.round(blob.size / 1024);
    const S = STRINGS[currentLang];
    const sizeText = sizeKo >= 1000
      ? (sizeKo/1024).toFixed(2) + S.mo
      : sizeKo + S.ko;
    if (compressed){
      resultMsg.textContent = S.sonopicSize + sizeText;
      resultMsg.classList.remove('error');
    } else if (mimeForBlob.includes('mp4')){
      resultMsg.textContent = S.sonopicSize + sizeText;
      resultMsg.classList.remove('error');
    } else {
      resultMsg.textContent = S.sonopicSize + sizeText + S.webmNote;
      resultMsg.classList.remove('error');
    }

    const file = new File([blob], filename, { type: mimeForBlob });
    if (navigator.canShare && navigator.canShare({ files: [file] })){
      shareBtn.onclick = async () => {
        try{
          await navigator.share({ files: [file], title: 'SonoPic' });
          backToPhotoScreen();
        }catch(e){ /* annulé par l'utilisateur : on reste sur l'écran résultat */ }
      };
    } else {
      shareBtn.onclick = () => {
        downloadLink.click();
        backToPhotoScreen();
      };
    }
  }

})();
</script>
